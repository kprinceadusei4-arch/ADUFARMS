{% extends "base.html" %}
{% block title %}My Profile - ADUFARMS{% endblock %}
{% block content %}
<h2>MY PROFILE</h2><div class="row g-3 mt-1"><div class="col-lg-5"><div class="card"><div class="card-body text-center"><img class="profile-avatar mb-3" src="{{ url_for('static', filename='images/users/' + (user.profile_image or 'team.jpg')) }}" alt="Profile image"><h4>{{ user.full_name }}</h4><p class="text-muted">{{ user.username }} - {{ user.role }}</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="action" value="image"><input class="form-control mb-3" type="file" name="profile_image" accept="image/*"><button class="btn btn-outline-primary">Update profile image</button></form></div></div></div><div class="col-lg-7"><div class="card"><div class="card-body"><h5>Change password</h5><form method="post"><input type="hidden" name="action" value="password"><label class="form-label">Current password</label><input class="form-control mb-3" name="current_password" type="password" required><label class="form-label">New password</label><input class="form-control mb-3" name="new_password" type="password" minlength="8" required><button class="btn btn-primary">Change password</button></form></div></div></div></div>
{% endblock %}
