{% extends "base.html" %}
{% block title %}Edit Customer - ADUFARMS{% endblock %}
{% block content %}
<div class="dashboard-heading"><div><h2>Edit customer</h2><p>Update contact and opening-balance details for {{ customer.name }}.</p></div></div>
<div class="card"><div class="card-body"><form method="post" class="smart-form"><div class="row g-3"><div class="col-md-4"><label class="form-label">Customer name <span class="required-mark">*</span></label><input name="name" class="form-control" value="{{ customer.name }}" required></div><div class="col-md-4"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ customer.phone or '' }}"></div><div class="col-md-4"><label class="form-label">Location</label><input name="location" class="form-control" value="{{ customer.location or '' }}"></div><div class="col-md-4"><label class="form-label">Customer type</label><select name="customer_type" class="form-select">{% for kind in ['RETAIL','WHOLESALE','INSTITUTION','OTHER'] %}<option {% if customer.customer_type == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Opening balance</label><input name="opening_balance" type="number" min="0" step="0.01" value="{{ customer.opening_balance or 0 }}" class="form-control"></div><div class="col-md-12"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ customer.address or '' }}"></div><div class="col-md-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3">{{ customer.notes or '' }}</textarea></div><div class="col-12"><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('customers') }}">Cancel</a></div></div></form></div></div>
{% endblock %}
