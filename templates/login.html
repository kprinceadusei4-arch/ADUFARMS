{% extends "base.html" %}
{% block title %}Login – ADUFARMS{% endblock %}
{% block public %}
<div class="login-wrap">
<div class="login-card">
<div class="text-center mb-4"><div class="login-brand-mark"><i class="bi bi-barley"></i></div><div class="brand">ADUFARMS</div><div class="text-muted">MAIZE DISTRIBUTION MANAGEMENT SYSTEM</div></div>
<form method="post">{{ csrf_input() }}
<label class="form-label">Username</label><input class="form-control mb-3" name="username" required autofocus>
<label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" required>
<button class="btn btn-primary w-100">LOGIN</button>
</form>
</div></div>
{% endblock %}
